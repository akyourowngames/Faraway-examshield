services:
  - type: web
    name: examshield-api
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: EXAMSHIELD_AI_HOST
        value: 0.0.0.0
      - key: EXAMSHIELD_AI_CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KILO_API_KEY
        sync: false
      - key: EXAMSHIELD_PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: EXAMSHIELD_AI_MASTER_KEY
        sync: false
      - key: EXAMSHIELD_API_AUTH_SECRET
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: EXAMSHIELD_OCR_CHAIN
        value: ocrspace,tesseract
      - key: EXAMSHIELD_OCR_TIMEOUT
        value: "45"
      - key: EXAMSHIELD_OCR_TOTAL_BUDGET_SECONDS
        value: "120"
      - key: EXAMSHIELD_OCR_MAX_DIMENSION
        value: "1920"
      - key: OCR_SPACE_TIMEOUT_SECONDS
        value: "45"
      - key: OCR_SPACE_LANGUAGE
        value: eng
      - key: OCR_SPACE_ENGINE
        value: "2"
      - key: EXAMSHIELD_OCR_MAX_RETRIES
        value: "0"
      - key: EXAMSHIELD_OCR_FAST
        value: "1"
      - key: EXAMSHIELD_OCR_WORKERS
        value: "1"
      - key: EXAMSHIELD_OCR_MODE
        value: sequential
      - key: EXAMSHIELD_OCR_PSMS
        value: "6,4"
      - key: EXAMSHIELD_OCR_PSM_WORKERS
        value: "2"
      - key: EXAMSHIELD_ANALYSIS_JOB_TIMEOUT_SECONDS
        value: "240"
      - key: EXAMSHIELD_ANALYSIS_JOB_GRACE_SECONDS
        value: "60"
      - key: EXAMSHIELD_STALE_JOB_SWEEP_SECONDS
        value: "60"
      - key: EXAMSHIELD_STALE_JOB_MAX_AGE_SECONDS
        value: "300"
      - key: EXAMSHIELD_AI_PLANNER_MODEL
        value: stepfun/step-3.7-flash:free
      - key: EXAMSHIELD_AI_MODEL
        value: stepfun/step-3.7-flash:free
      - key: EXAMSHIELD_TOOL_PLANNER_TIMEOUT_SECONDS
        value: "4"
      - key: EXAMSHIELD_AI_STREAM_TIMEOUT_SECONDS
        value: "45"
      - key: EXAMSHIELD_LIST_CACHE_TTL_SECONDS
        value: "8"
      - key: EXAMSHIELD_AI_CHAT_MAX_TOKENS
        value: "220"
      - key: EXAMSHIELD_AI_PLANNER_MAX_TOKENS
        value: "120"
